name: 自动化部署

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行 Lint 检查
        run: npm run lint
        continue-on-error: false

      - name: TypeScript 类型检查
        run: npx tsc --noEmit
        continue-on-error: false

      - name: 生成 Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 构建项目
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # 生产部署由 Vercel 的 GitHub 集成自动完成；此步骤仅在配置了
      # VERCEL_TOKEN 时作为备用 CLI 部署通道执行
      - name: 部署到 Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'

      - name: 执行数据库迁移
        if: success()
        run: |
          echo "等待部署完成..."
          sleep 10
          curl -X POST https://www.clczl.asia/api/admin/migrate-category-field || echo "迁移 API 调用失败，请手动检查"
        continue-on-error: true

      - name: 执行博客文章迁移
        if: success()
        run: |
          echo "🚀 开始执行博客文章迁移..."
          sleep 5
          response=$(curl -s -X POST https://www.clczl.asia/api/admin/migrate-posts)
          echo "迁移响应: $response"
          
          # 检查响应是否包含 success
          if echo "$response" | grep -q '"success":true'; then
            echo "✅ 博客文章迁移成功"
            echo "$response" | jq '.' || echo "$response"
          else
            echo "⚠️ 博客文章迁移可能失败或部分失败"
            echo "$response" | jq '.' || echo "$response"
            # 不退出，因为可能是部分成功
          fi
        continue-on-error: true

      - name: 发送通知
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            部署状态: ${{ job.status }}
            分支: ${{ github.ref }}
            提交: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

