name: 生产环境部署

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    env:
      DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行 ESLint
        run: npm run lint
        continue-on-error: false

      - name: TypeScript 类型检查
        run: npx tsc --noEmit
        continue-on-error: false

      - name: 生成 Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 构建项目
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # 生产部署由 Vercel 的 GitHub 集成自动完成；此步骤仅在配置了
      # VERCEL_TOKEN 时作为备用 CLI 部署通道执行
      - name: 部署到 Vercel 生产环境
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'

      - name: 执行数据库迁移
        if: success()
        run: |
          echo "等待部署完成..."
          sleep 10
          curl -X POST https://www.clczl.asia/api/admin/migrate-category-field || echo "迁移 API 调用失败，请手动检查"
        continue-on-error: true

      - name: 执行博客文章迁移
        if: success()
        run: |
          echo "🚀 开始执行博客文章迁移..."
          sleep 5
          response=$(curl -s -X POST https://www.clczl.asia/api/admin/migrate-posts)
          echo "迁移响应: $response"
          
          # 检查响应是否包含 success
          if echo "$response" | grep -q '"success":true'; then
            echo "✅ 博客文章迁移成功"
            echo "$response" | jq '.' || echo "$response"
          else
            echo "⚠️ 博客文章迁移可能失败或部分失败"
            echo "$response" | jq '.' || echo "$response"
            # 不退出，因为可能是部分成功
          fi
        continue-on-error: true

      - name: 健康检查
        if: success()
        run: |
          echo "执行健康检查..."
          sleep 5
          response=$(curl -s -o /dev/null -w "%{http_code}" https://www.clczl.asia || echo "000")
          if [ "$response" != "200" ]; then
            echo "⚠️ 健康检查失败，HTTP 状态码: $response"
            exit 1
          else
            echo "✅ 健康检查通过"
          fi
        continue-on-error: true

      - name: 发送 Slack 通知
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 生产环境部署 ${{ job.status == 'success' && '成功' || '失败' }}
            
            📦 分支: ${{ github.ref }}
            📝 提交: ${{ github.sha }}
            👤 提交者: ${{ github.actor }}
            🔗 部署链接: ${{ steps.vercel-deploy.outputs.preview-url || 'N/A' }}
            
            ${{ job.status == 'success' && '✅ 部署已完成，网站已更新' || '❌ 部署失败，请检查日志' }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: 发送钉钉通知（可选）
        if: always() && env.DINGTALK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ job.status == 'success' && '成功' || '失败' }}"
          EMOJI="${{ job.status == 'success' && '✅' || '❌' }}"
          curl -X POST "$DINGTALK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"title\": \"生产环境部署通知\",
                \"text\": \"## ${EMOJI} 生产环境部署${STATUS}\n\n**分支:** ${{ github.ref }}\n\n**提交:** \`${{ github.sha }}\`\n\n**提交者:** ${{ github.actor }}\n\n**时间:** $(date '+%Y-%m-%d %H:%M:%S')\n\n**状态:** ${STATUS}\"
              }
            }"
        continue-on-error: true
